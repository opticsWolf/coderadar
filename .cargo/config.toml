# CodeRadar — static tree-sitter compilation for offline wheel builds
# TSLP_LANGUAGES: comma-separated list of grammars to compile statically.
# "all" compiles every supported grammar (~120 MB binary, ~371 languages).
# We compile our 12 core languages (~8 MB) for offline use; the remaining
# 359 languages are available via on-demand download at runtime.
#
# TSLP_LINK_MODE=static: embed grammar code directly in the binary.
# No shared-library loading, no runtime downloads needed for core langs.

[env]
TSLP_LANGUAGES = "python,typescript,javascript,rust,go,java,c,cpp,ruby,php,csharp,kotlin"
TSLP_LINK_MODE = "static"

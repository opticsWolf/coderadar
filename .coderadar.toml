# CodeRadar — project configuration
#
# Every key below is read by something; the comment says by what. Sections
# that were documented but inert ([llm], [output], [ingestion], [memory],
# [git], [python], the hnsw_* knobs, the audit_* knobs) were removed rather
# than left looking load-bearing. `coderadar analyze` prints a line naming
# any key it could not use, so an unknown key here will say so.

[project]
# `roots` narrows the walk to these subdirectories, relative to the project
# root. Omitted (as here) the whole root is walked — which is what this repo
# needs, its sources living under core_indexer/ and py_agent/. Pointing it at
# a directory that does not exist yields an empty index, so leave it out
# unless you mean it. Read by `analyze`.
# roots = ["src/", "tests/"]
#
# Gitignore-syntax globs skipped by the walk, on top of .gitignore itself.
exclude = ["**/migrations/**", "**/__pycache__/**", "**/.venv/**"]

[database]
# Where the Macrame store file goes, relative to the project root unless
# absolute. Read by `analyze`.
path = ".coderadar/store/coderadar.db"

[embedding]
# Index-time and query-time must name the same model: a dimension mismatch
# produces confident nonsense rather than an error. Read by
# `compute_embeddings` and by the MCP search path, via `embedding_settings`.
model = "BAAI/bge-small-en-v1.5"
dimension = 384
max_body_tokens = 2000
batch_size = 32

[watch]
# Read by `coderadar.Watcher`. A CLI flag still overrides these.
debounce_ms = 100
max_file_size_bytes = 1048576

[mutation]
# The policy gate in the Rust engine, enforced at the FFI boundary — a plan
# arriving as arbitrary JSON is checked against these before any file is read
# or written.
enabled = true
# DR-27: dry-run stays ON until D18 (self-hosting) lands. The whole chain
# is dry-by-default by signature (tool_router, MCP, CLI); this key states
# the intent so flipping it is a deliberate, reviewable moment — not drift.
default_dry_run = true
max_files_per_plan = 100
max_edits_per_plan = 500
max_body_tokens = 4000
backup_retention_hours = 24
post_verify = true
max_repair_attempts = 3
require_clean_git = false
# DR-27 self-hosting allow-list: the repo's own dirs. Leading-directory
# patterns are ROOT-ANCHORED — the old generic "src/" matched none of
# them (py_agent/src/ is not src/).
allow = ["core_indexer/", "py_agent/", "tests/"]
# DENY WINS: checked before allow in the engine — a path matching both is
# refused. There is no exception mechanism; remove the deny entry instead.
deny = [".git/", ".coderadar/", "/migrations/", "/*.lock", "/generated/"]

[resolution]
# Read by the resolution cascade.
min_confidence = 0.3

[resolution.import_graph]
max_import_depth = 3
include_same_package = true

# ── Carried, not yet read ──────────────────────────────────────────────────
# These are accepted and stored, but no live path consults them. They are
# kept rather than cut because the decision about the code that would read
# them — signature.rs, the query cache — is a separate one.
# Setting them changes nothing today. ([resolution.lsp] is still accepted by
# the schema and deliberately not written here: the pool it configures is
# never constructed, so a value would only be noise.)

[resolution.signature]
min_score = 0.5
name_weight = 0.4
arity_weight = 0.3
proximity_weight = 0.3

[query]
max_depth = 5
default_top_k = 10
cache_ttl_seconds = 300
cache_max_size = 256
use_rust_graph_for_traversal = true

[package]
name = "coderadar"
version = "0.16.0"
edition = "2024"
rust-version = "1.97"
publish = false
description = "Rust port of `py_agent/src/coderadar/ops.py`, generated by rust-anything"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
core_indexer = { path = "../../core_indexer" }
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py39"] }
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "unbounded_depth"] }
regex = "1"
fancy-regex = "0.14"
pathdiff = "0.2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"

[profile.release]
lto = true

[lints.clippy]
all = { level = "warn", priority = -1 }

[lints.rust]
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[[bin]]
name = "coderadar-rs"
path = "src/main.rs"

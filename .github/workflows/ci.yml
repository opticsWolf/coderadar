name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test-rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/tree-sitter-language-pack
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run Rust tests
        run: cargo test --package core_indexer

  test-python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Build + install
        run: |
          uv venv
          uv pip install maturin
          uv run maturin develop --release --manifest-path core_indexer/Cargo.toml
          uv pip install -e ".[dev]"

      # The whole suite, not a subset — `testpaths = ["tests"]` in pyproject.toml
      # is the source of truth for what CI runs.
      - name: Run Python tests
        run: uv run pytest -q

  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    # Blocking since v0.11.14 (P4 hygiene): clippy 0, rustfmt clean,
    # ruff check clean. Keep it at zero — flip back to advisory (with a
    # reason) rather than landing warnings.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --package core_indexer --all-targets -- -D warnings

      - name: ruff
        # Pinned: unpinned `uvx ruff` drifted defaults under us before
        # (0.16.x flags 950+ on a tree written pre-rule). Bump the pin
        # deliberately and clean to zero against the new version.
        run: uvx ruff@0.16.5 check py_agent/src tests

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'website/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'website/**'

jobs:
  test-rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Ubuntu + Windows only: `cargo test` on macOS cannot link pyo3's
      # `extension-module` (`_PyDict_GetItemWithError` undefined), and the
      # coverage that matters there is the Python leg, which builds a real
      # wheel. See the comment on `test-python`.
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            ~/.cache/tree-sitter-language-pack
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Run Rust tests
        run: cargo test --package core_indexer

  test-python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # macOS is here because `release.yml` ships a macOS wheel and the
      # store's one-engine-per-path contract exists for a POSIX-only
      # behaviour (`database is locked`): the untested POSIX platform is the
      # one that could break a shipped wheel the way ubuntu did. This leg
      # builds the extension and runs the suite through it, which is more than
      # the Rust leg could do there.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Build + install
        run: |
          uv venv
          uv pip install maturin
          uv run maturin develop --release --manifest-path core_indexer/Cargo.toml
          uv pip install -e ".[dev]"

      # The whole suite, not a subset — `testpaths = ["tests"]` in pyproject.toml
      # is the source of truth for what CI runs.
      - name: Run Python tests
        run: uv run pytest -q

  lint:
    name: Lint (blocking)
    runs-on: ubuntu-latest
    # Blocking since v0.11.14 (P4 hygiene): clippy 0, rustfmt clean,
    # ruff check clean. Keep it at zero — flip back to advisory (with a
    # reason) rather than landing warnings.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --package core_indexer --all-targets -- -D warnings

      - name: ruff
        # Pinned: unpinned `uvx ruff` drifted defaults under us before
        # (0.16.x flags 950+ on a tree written pre-rule). Bump the pin
        # deliberately and clean to zero against the new version.
        run: uvx ruff@0.16.5 check py_agent/src tests

  dogfood:
    name: Dogfood battery (round 2)
    runs-on: ubuntu-latest
    # §3.2: `battery_round2.py` was manual dogfood (exit-0-only at the
    # suite level) while covering all CLI commands + all MCP tools
    # against a self-contained fixture (~90s). Wired here so surface
    # drift fails the build instead of waiting for a human run.
    # `battery_readonly` stays manual: it needs the repo's own
    # (gitignored) store. `battery_mutation` stays manual: it rewrites
    # the demo files with dry_run=False.
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v2

      - name: Build + install
        run: |
          uv venv
          uv pip install maturin
          uv run maturin develop --release --manifest-path core_indexer/Cargo.toml
          uv pip install -e ".[dev]"

      - name: Run round-2 battery
        run: uv run python tests/cr_edit_tests/battery_round2.py

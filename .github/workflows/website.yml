name: Website

# Static site deploy. Deliberately decoupled from CI:
# - this workflow only runs when website/** (or itself) changes;
# - ci.yml paths-ignores website/**, so site edits skip the full matrix;
# - actions/deploy-pages creates no push event, so a deploy can never
#   re-trigger CI or Release.
# One-time repo setup: Settings → Pages → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/website.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - id: deployment
        uses: actions/deploy-pages@v4
